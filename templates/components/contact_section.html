<div

    id="link-6"
    class="container pt-20 pb-20 mx-auto"
>
    <div class="flex items-center justify-center mt-10 text-4xl font-semibold text-white md:py-10">
        Contact
    </div>

    <div
        x-bind:class="{'opacity-0': !$store.portfolio.showContact}" 
        class="flex items-center justify-center mt-10 transition-opacity duration-1000"
    >
        <div class="w-4/5 max-w-4xl px-4 py-3">
            <div class="p-6 border border-zinc-700 rounded bg-zinc-900/50">
                {% include 'partials/contact_form.html' %}
            </div>
        </div>

    </div>
    
</div>
