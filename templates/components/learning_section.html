{% load static %}

<div
    id="link-5"
    x-data
    x-intersect.half="$store.portfolio.openTab=5, $store.portfolio.showLearning=true"
    class="container px-5 pb-20 mx-auto p-4"
>
    <div class="flex items-center justify-center mt-10 text-4xl font-semibold text-white md:py-10">
        Learning
    </div>
    <div
        x-bind:class="{'opacity-0 translate-y-4': !$store.portfolio.showLearning}"
        class="max-w-4xl mx-auto transition-all duration-700 ease-out"
    >
        <div class="p-6 border border-zinc-700 rounded bg-zinc-900/50 border-l-4 border-l-red-600">
            <div class="flex items-center gap-4">
                <div class="flex items-center justify-center w-12 h-12 bg-zinc-800 rounded-lg">
                    <svg class="w-7 h-7 text-blue-400" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-semibold tracking-widest text-red-600 uppercase">Currently Learning</span>
                        <span class="px-2 py-0.5 text-xs font-bold text-blue-400 bg-blue-400/10 border border-blue-400/30 rounded">Go</span>
                    </div>
                    <p class="mt-1 text-sm text-neutral-400">
                        Exploring Go for backend services and CLI tooling
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
