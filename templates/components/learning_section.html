{% load static %}

<div
    x-data
    x-intersect.half="$store.portfolio.showLearning=true"
    class="container px-5 py-16 mx-auto"
>
    <div
        x-bind:class="{'opacity-0 translate-y-4': !$store.portfolio.showLearning}"
        class="flex flex-col items-center justify-center max-w-lg px-8 py-6 mx-auto transition-all duration-700 ease-out border border-zinc-700 rounded-lg bg-zinc-900/50"
    >
        <span class="text-xs font-semibold tracking-widest text-red-600 uppercase">Currently Learning</span>
        <div class="flex items-center gap-3 mt-3">
            <div class="flex items-center justify-center w-10 h-10">
                <svg class="w-8 h-8 text-blue-400" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span class="text-xl font-bold text-white">Go</span>
        </div>
        <p class="mt-2 text-sm text-center text-neutral-400">
            Exploring Go for backend services and CLI tooling
        </p>
    </div>
</div>
